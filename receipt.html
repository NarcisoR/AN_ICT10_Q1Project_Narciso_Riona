<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Generator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2023.11.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2023.11.1/core.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1b1f47;
        }
        nav {
            background-color: #fbdeff;
            color: #1b1f47;
            padding: 25px;
            justify-content: space-between;
            display: flex;
            align-items: center;
        }
        nav a {
            color: #1b1f47;
            margin-left: 20px;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.586);
            padding: 25px;
            border-radius: 12px;
            border: 4px dashed #fbdeff;
        }
        .header{
            background-color: #1b1f47;
            color: #fffcf6;
            text-align: center;
            padding: 10px;
            border-radius: 25px;
            margin-bottom: 20px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border: 4px solid white;
            border-radius: 25px;
        }
        button {
            width: 100%;
            background: #c4c5e8;
            color: #1b1f47;
            border: none;
            padding: 15px;
            margin-top: 20px;
            border-radius: 25px;
            font-size: 15px;
        }
        button:hover {
            background: #d5fbff;
        }
        .receipt-summary {
            margin-top: 20px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 6px;
            border: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body>

    <nav>
        <div><strong>Skewer</strong></div>
        <div>
            <a href="index.html">SKU Generator</a>
            <a href="receipt.html">Receipt Generator</a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <p>Welcome to the</p>
            <h1>⋆ the Coffee Shop ⋆</h1>
        </div>

        <h3>Menu:</h3>

        <div class="menu-item">
            <label><input type="checkbox" id="item1" value="99"> Americano</label>
            <span>₱99</span>
        </div>
        <div class="menu-item">
            <label><input type="checkbox" id="item2" value="129"> Spanish Latte</label>
            <span>₱129</span>
        </div>
        <div class="menu-item">
            <label><input type="checkbox" id="item3" value="189"> Cold Brew Malt</label>
            <span>₱189</span>
        </div>
        <div class="menu-item">
            <label><input type="checkbox" id="item4" value="159"> Affogato</label>
            <span>₱159</span>
        </div>
        <div class="menu-item">
            <label><input type="checkbox" id="item5" value="129"> Caramel Macchiato</label>
            <span>₱129</span>
        </div>

        <button py-click="order">Create Order</button>

        <div class="receipt-summary">
            Your order summary will appear here.
        </div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
