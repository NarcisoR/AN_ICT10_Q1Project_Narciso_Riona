<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU</title>

    <link rel="stylesheet" 
     href="https://pyscript.net/releases/2025.2.4/core.css">

    <script type="module"
     src="https://pyscript.net/releases/2025.2.4/core.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1b1f47;
        }
        nav {
            background-color: #fbdeff;
            color: #1b1f47;
            padding: 25px;
            justify-content: space-between;
            display: flex;
            align-items: center;
        }
        nav a {
            color: #1b1f47;
            margin-left: 20px;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.586);
            padding: 25px;
            border-radius: 12px;
            border: 4px dashed #fbdeff;
        }
        .header{
            background-color: #1b1f47;
            color: #fffcf6;
            text-align: center;
            padding: 10px;
            border-radius: 25px;
            margin-bottom: 20px;
        }
        label {
            margin-top: 15px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            width: 100%;
            background: #c4c5e8;
            color: #1b1f47;
            border: none;
            padding: 15px;
            margin-top: 20px;
            border-radius: 25px;
            font-size: 15px;
        }
        button:hover {
            background: #d5fbff;
        }
        .output {
            margin-top: 20px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            color: #1b1f47;
        }
    </style>
</head>
<body>

    <nav>
        <div><b>Skewer</b></div>
        <div>
            <a href="index.html">SKU Generator</a>
            <a href="receipt.html">Receipt Generator</a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>⋆ SKU Generator ⋆</h1>
        </div>

        <label for="category">Category</label>
        <select id="category">
            <option value="Food">Food</option>
            <option value="Drinks">Drinks</option>
            <option value="Electronics">Electronics</option>
            <option value="Apparel">Apparel</option>
        </select>

        <label for="product_name">Product Name</label>
        <input type="text" id="product_name" placeholder="e.g. Bottled Water">

        <label for="stock">Stock Quantity</label>
        <input type="number" id="stock" placeholder="e.g. 100">

        <button py-click="generate"><b>Generate</b></button>

        <div class="output" id="sku-output">Your generated SKU will appear here.</div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
